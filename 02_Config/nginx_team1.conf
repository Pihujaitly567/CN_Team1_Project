# ===== Team 1 edge - "Mac 2" (127.0.0.12) =====
log_format lb '$remote_addr:$remote_port -> $upstream_addr [$time_local] '
 '"$request" $status X-Backend=$upstream_http_x_backend';

upstream team1_backends {
 server 127.0.0.13:3001 max_fails=1 fail_timeout=10s;
 server 127.0.0.14:3002 max_fails=1 fail_timeout=10s;
}

server {
 listen 127.0.0.12:80;
 server_name app.team1.test api.team1.test;
 return 301 https://$host$request_uri;
}

server {
 listen 127.0.0.12:443 ssl;
 http2 on;
 server_name app.team1.test api.team1.test;

 ssl_certificate /opt/homebrew/etc/nginx/certs/app.team1.test.crt;
 ssl_certificate_key /opt/homebrew/etc/nginx/certs/app.team1.test.key;
 ssl_protocols TLSv1.2 TLSv1.3;

 access_log /opt/homebrew/var/log/nginx/team1_access.log lb;

 location / {
  proxy_pass http://team1_backends;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_connect_timeout 2s;
  proxy_next_upstream error timeout http_502 http_503;
  add_header X-Edge "mac2-nginx" always;
 }
}
