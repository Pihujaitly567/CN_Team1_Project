# Phase 2 Service Isolation — PF Anchor Template (com.apple/cn_phase2_backend)
# Note: On a single-Mac loopback setup, macOS default /etc/pf.conf includes
# "set skip on lo0", which causes lo0 traffic to bypass PF filtering unless
# lo0 filtering is explicitly enabled or tested across separate LAN hosts.
#
# In a multi-Mac LAN setup, replace loopback aliases with the actual Mac LAN IPs
# and interface (e.g., en0) so only Mac 2 (Edge) can reach ports 3001 and 3002.

# Allow Edge (127.0.0.12) to reach Backend A and Backend B
pass in quick on lo0 proto tcp from 127.0.0.12 to 127.0.0.13 port 3001
pass in quick on lo0 proto tcp from 127.0.0.12 to 127.0.0.14 port 3002

# Block all other direct connections to backend ports
block return in quick on lo0 proto tcp from any to 127.0.0.13 port 3001
block return in quick on lo0 proto tcp from any to 127.0.0.14 port 3002
