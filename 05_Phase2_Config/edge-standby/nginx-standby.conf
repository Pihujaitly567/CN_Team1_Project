# Phase 2 Standby Edge Main Nginx Config (runs as a secondary instance on 127.0.0.16)
worker_processes 1;
pid /tmp/nginx-standby.pid;
error_log /tmp/nginx-standby-error.log;

events {
    worker_connections 128;
}

http {
    include /opt/homebrew/etc/nginx/mime.types;
    access_log /tmp/nginx-standby-access.log;
    include team1_standby.conf;
}
